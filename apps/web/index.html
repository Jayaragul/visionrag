<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision-RAG Live</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --dim: #8b93a3; --accent: #4ea1ff;
    --warn: #ffb02e; --ok: #38d39f; --rec: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  /* Camera state must be visible whenever capture is live (PRD 9). */
  #camstate {
    margin-left: auto; font-size: 12px; color: var(--dim);
    display: flex; align-items: center; gap: 6px;
  }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  #dot.live { background: var(--rec); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #stage { position: relative; background: #000; line-height: 0; }
  video, canvas { width: 100%; display: block; }
  canvas { position: absolute; inset: 0; }

  .controls { display: flex; gap: 8px; padding: 12px 14px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-width: 96px; padding: 11px 14px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #05131f; }
  button.danger  { background: transparent; border-color: #5b2b2b; color: #ff8a8a; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--line); border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat { background: var(--bg); padding: 9px 6px; text-align: center; }
  .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10px; color: var(--dim); text-transform: uppercase;
               letter-spacing: .5px; }

  section { padding: 12px 14px; }
  h2 { font-size: 12px; color: var(--dim); text-transform: uppercase;
       letter-spacing: .6px; margin: 0 0 8px; font-weight: 600; }

  #timeline { max-height: 240px; overflow-y: auto; }
  .ev {
    display: flex; gap: 9px; align-items: baseline; padding: 6px 8px;
    border-left: 2px solid var(--accent); background: var(--panel);
    border-radius: 0 6px 6px 0; margin-bottom: 4px; font-size: 13px;
  }
  .ev.suspect { border-left-color: var(--warn); }
  .ev time { color: var(--dim); font-variant-numeric: tabular-nums;
             font-size: 12px; min-width: 46px; }
  .ev .who { color: var(--dim); font-size: 12px; margin-left: auto; }
  .ev .flag { color: var(--warn); font-size: 11px; }

  .askrow { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 11px 12px; border-radius: 9px; font-size: 15px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  #answer { margin-top: 10px; padding: 11px 12px; border-radius: 9px;
            background: var(--panel); border: 1px solid var(--line); display: none; }
  #answer .meta { font-size: 12px; color: var(--dim); margin-top: 7px; }
  #answer.abstain { border-color: #4a3a1a; }
  #log { font-size: 12px; color: var(--dim); padding: 0 14px 24px; }
</style>
</head>
<body>
<header>
  <h1>Vision-RAG Live</h1>
  <div id="camstate"><span id="dot"></span><span id="camtext">camera off</span></div>
</header>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div class="controls">
  <button id="start" class="primary">Start camera</button>
  <button id="stop" disabled>Stop</button>
  <button id="delete" class="danger">Delete session</button>
</div>

<div class="stats">
  <div class="stat"><b id="s-fps">-</b><span>analysis fps</span></div>
  <div class="stat"><b id="s-lat">-</b><span>latency ms</span></div>
  <div class="stat"><b id="s-obj">-</b><span>tracked</span></div>
  <div class="stat"><b id="s-ev">0</b><span>events</span></div>
</div>

<section>
  <h2>Event timeline</h2>
  <div id="timeline"></div>
</section>

<section>
  <h2>Ask about this session</h2>
  <div class="askrow">
    <input id="q" type="text" placeholder="What moved near the door?"
           autocomplete="off">
    <button id="ask" style="flex:0 0 auto">Ask</button>
  </div>
  <div id="answer"></div>
</section>

<div id="log"></div>
<script src="/app.js"></script>
</body>
</html>
